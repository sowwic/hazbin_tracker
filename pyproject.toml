[project]
name = "sowwic-hazbin-tracker"
version = "1.1.1"
description = "Hazbin hotel cards release tracker"
authors = [
  { name = "Dmitrii Shevchenko", email = "47799401+sowwic@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.14"
packages = [{ include = "hazbin_tracker", from = "src" }]
dependencies = [
  "pyside6 ",
  "requests",
  "platformdirs",
  "curl-cffi>=0.17.0",
  "sowwic-json-config>=1.0.7",
  "sowwic-json-config-qt>=1.0.1",
  "pydantic>=2.14.2",
]

[dependency-groups]
dev = [
  "beautifulsoup4>=4.15.0",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "pytest-qt",
  "ruff",
  "pyinstaller",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-autorefs",
  "mkdocs-autoapi",
]

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hazbin_tracker"

[tool.ruff]
src = ["src"]
exclude = ["**/resources_rc.py"]

show-fixes = true
line-length = 89
lint.select = ["E", "F", "UP", "D"]
lint.ignore = ["D203", "D213", "D413", "D100", "D104", "D103"]

[tool.pytest.ini_options]
addopts = "--cov=hazbin_tracker --cov-report=term-missing"
log_cli = true
log_cli_level = "INFO"
